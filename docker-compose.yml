services:
  aeon-forge-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: aeon-forge-bot:latest
    container_name: aeon-forge-bot
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot-network

  postgres:
    image: postgres:16-alpine
    container_name: aeon-forge-bot-postgres
    environment:
      POSTGRES_DB: aeon_forge_bot
      POSTGRES_USER: aeon_forge_bot
      # Same password the bot reads as DB_PASSWORD from .env
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - ./data/postgres/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeon_forge_bot -d aeon_forge_bot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot-network
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: aeon-forge-bot-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    networks:
      - bot-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  bot-network:
    driver: bridge
